<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prescript Pager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div>PRESCRIPT PAGER TERMINAL</div>
      <div class="status"><span class="dot"></span><span id="statusText">CHECKING CONFIG</span></div>
    </div>

    <div class="body">
      <div class="logo-wrap">
        <img src="Index_Logo.png" alt="Index Logo" class="logo" />
      </div>
      <div class="screen">
        <div class="screen-header">
          <span>ACTIVE CHANNEL</span>
          <span class="prescript-id" id="prescriptId">PS-000</span>
        </div>

        <div class="output" id="output" role="status" aria-live="polite" aria-atomic="true">等待接收指令<span class="cursor">█</span></div>

        <div class="meta">
          <div class="meta-box">MODE: <span id="modeValue">RITUAL</span></div>
          <div class="meta-box">STATE: <span id="stateValue">IDLE</span></div>
          <div class="meta-box">LAST SYNC: <span id="timeValue">--:--:--</span></div>
        </div>
      </div>

      <div class="controls">
        <label class="mode-control" for="modeSelect">MODE
          <select id="modeSelect">
            <option value="ritual">仪式 · RITUAL</option>
            <option value="daily">日常 · DAILY</option>
            <option value="absurd">荒谬 · ABSURD</option>
          </select>
        </label>
        <label class="sound-control"><input type="checkbox" id="soundEnabled" checked />音效</label>
        <button class="button" id="receiveBtn">RECEIVE PRESCRIPT</button>
        <div class="subline" id="connectionInfo">正在检查服务配置…</div>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
